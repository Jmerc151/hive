services:
  - type: web
    name: agentforge-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agentforge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3002"
    healthCheckPath: /api/health

databases:
  - name: agentforge-db
    plan: starter
    databaseName: agentforge
