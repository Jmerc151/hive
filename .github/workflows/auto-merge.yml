name: Auto-merge Claude branches

on:
  push:
    branches: ['claude/**']

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and merge PR
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Check for existing open PR from this branch
            const { data: existing } = await github.rest.pulls.list({
              owner, repo,
              head: `${owner}:${branch}`,
              base: 'main',
              state: 'open'
            });

            let pr;
            if (existing.length > 0) {
              pr = existing[0];
              console.log(`Found existing PR #${pr.number}`);
            } else {
              // Create new PR
              const { data: created } = await github.rest.pulls.create({
                owner, repo,
                title: `Auto-merge: ${branch}`,
                head: branch,
                base: 'main',
                body: 'Auto-merged from Claude Code session.'
              });
              pr = created;
              console.log(`Created PR #${pr.number}`);
            }

            // Merge it
            try {
              await github.rest.pulls.merge({
                owner, repo,
                pull_number: pr.number,
                merge_method: 'squash'
              });
              console.log(`Merged PR #${pr.number}`);
            } catch (e) {
              console.log(`Merge failed: ${e.message}`);
              // If merge fails due to conflicts, leave PR open for manual review
              if (e.status === 405) {
                console.log('Merge conflict detected — PR left open for manual review');
              } else {
                throw e;
              }
            }
